<!doctype html>
<html lang="pt-PT">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendamento | Vila Nova Digital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="../assets/css/styles.css"><style>.booking-page{background:var(--soft);min-height:100vh}.booking-shell{max-width:1050px;margin:auto}.booking-head{padding:55px 0 30px}.booking-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px}.slot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.slot{border:1px solid var(--line);background:#fff;border-radius:7px;padding:11px;font-size:.72rem;color:var(--muted)}.slot:hover,.slot.selected{border-color:var(--blue);background:#e8f1ff;color:var(--blue)}.booking-summary{background:#eef8f7;border-radius:10px;padding:18px;font-size:.76rem}@media(max-width:600px){.booking-shell{width:calc(100% - 28px)}.slot-grid{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body class="booking-page"><header class="main-nav"><div class="container-fluid booking-shell d-flex justify-content-between align-items-center py-3"><a class="brand" href="../index.html"><span class="brand-symbol"><i class="bi bi-buildings"></i></span><span><b>VILA NOVA</b><small>DIGITAL</small></span></a><a href="servicos.html" class="btn btn-outline-primary btn-sm">Serviços</a></div></header><main class="booking-shell"><section class="booking-head"><span class="overline">Atendimento municipal</span><h1 class="mt-2">Marque quando<br><span style="color:var(--blue)">lhe for conveniente.</span></h1><p class="text-muted">Escolha o serviço, o formato e um horário disponível.</p></section><form id="bookingForm" class="booking-card"><div id="bookingFeedback" class="alert d-none"></div><div class="row g-4"><div class="col-md-6"><label class="form-label">Serviço</label><select class="form-select" required><option value="">Selecione</option><option>Atendimento geral</option><option>Ação social</option><option>Urbanismo e obras</option><option>Finanças municipais</option><option>Licenciamento</option></select></div><div class="col-md-6"><label class="form-label">Formato</label><select class="form-select" required><option>Presencial · Paços do Município</option><option>Videochamada</option><option>Telefone</option></select></div><div class="col-12"><label class="form-label">Escolha um horário · 14 de novembro de 2026</label><div class="slot-grid"><button type="button" class="slot">09:00</button><button type="button" class="slot">09:30</button><button type="button" class="slot">10:00</button><button type="button" class="slot">10:30</button><button type="button" class="slot">11:00</button><button type="button" class="slot">11:30</button><button type="button" class="slot">14:00</button><button type="button" class="slot">14:30</button></div></div><div class="col-md-6"><label class="form-label">Nome</label><input class="form-control" required placeholder="Nome completo"></div><div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" required placeholder="email@exemplo.pt"></div><div class="col-12"><div class="booking-summary"><i class="bi bi-info-circle me-2"></i>Receberá uma confirmação com o código da marcação e as instruções de atendimento.</div></div><div class="col-12"><button class="btn btn-primary" type="submit">Confirmar marcação <i class="bi bi-calendar-check ms-1"></i></button></div></div></form></main><script>let selected="";document.querySelectorAll(".slot").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".slot").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");selected=b.textContent}));document.getElementById("bookingForm").addEventListener("submit",e=>{e.preventDefault();const box=document.getElementById("bookingFeedback");if(!selected){box.className="alert alert-warning";box.textContent="Escolha primeiro um horário disponível.";return}box.className="alert alert-success";box.innerHTML=`<i class="bi bi-check-circle me-2"></i>Marcação confirmada para as <strong>${selected}</strong>. Código: <strong>ATD-2026-0091</strong>.`;e.target.reset();document.querySelectorAll(".slot").forEach(x=>x.classList.remove("selected"));selected=""});</script></body></html>
