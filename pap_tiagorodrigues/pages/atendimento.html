<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atendimento digital | Vila Nova Digital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../assets/css/portal-enhancements.css"><script src="../assets/js/portal-enhancements.js" defer></script><style>.chat-page{background:#f5f8fb;min-height:100vh}.chat-shell{max-width:1120px;margin:auto}.chat-grid{display:grid;grid-template-columns:.75fr 1.25fr;gap:18px;padding:40px 0}.chat-info,.chat-box{background:#fff;border:1px solid var(--line);border-radius:13px;padding:25px}.chat-info p{font-size:.78rem;color:var(--muted);line-height:1.6}.chat-box{display:flex;flex-direction:column;min-height:430px}.messages{flex:1;background:#f5f8fb;border-radius:10px;padding:18px}.message{max-width:82%;font-size:.76rem;padding:11px 14px;border-radius:12px;margin-bottom:10px;line-height:1.5}.bot{background:#fff;border:1px solid #e8edf2}.user{background:#1769d1;color:#fff;margin-left:auto}.chat-form{display:flex;gap:8px;margin-top:12px}.chat-form input{flex:1}@media(max-width:750px){.chat-grid{grid-template-columns:1fr}.chat-shell{width:calc(100% - 28px)}}</style></head><body class="chat-page"><header class="main-nav"><div class="container-fluid chat-shell d-flex justify-content-between align-items-center py-3"><a class="brand" href="../index.html"><span class="brand-symbol"><i class="bi bi-buildings"></i></span><span><b>VILA NOVA</b><small>DIGITAL</small></span></a><a href="../index.html" class="btn btn-outline-primary btn-sm">Voltar ao portal</a></div></header><main class="chat-shell"><div class="pt-5"><span class="overline">Atendimento digital</span><h1 class="mt-2">Como podemos ajudar?</h1><p class="text-muted">Encontre respostas rápidas ou fale com a equipa municipal.</p></div><div class="chat-grid"><aside class="chat-info"><span class="overline">Perguntas frequentes</span><div class="list-group list-group-flush mt-3"><button class="list-group-item list-group-item-action px-0" onclick="ask('Como acompanho uma ocorrência?')">Como acompanho uma ocorrência?</button><button class="list-group-item list-group-item-action px-0" onclick="ask('Onde vejo os apoios disponíveis?')">Onde vejo os apoios disponíveis?</button><button class="list-group-item list-group-item-action px-0" onclick="ask('Como marco atendimento?')">Como marco atendimento?</button><button class="list-group-item list-group-item-action px-0" onclick="ask('Qual o horário do balcão?')">Qual o horário do balcão?</button></div><a href="agendamento.html" class="btn btn-primary btn-sm mt-4">Marcar atendimento</a></aside><section class="chat-box"><div class="d-flex align-items-center gap-2 mb-3"><span class="profile-avatar">VN</span><div><b style="font-size:.8rem">Assistente Vila Nova</b><small class="d-block text-success" style="font-size:.65rem">Online agora</small></div></div><div class="messages" id="messages"><div class="message bot">Olá! Sou o assistente digital do município. Como posso ajudar?</div></div><form class="chat-form" id="chatForm"><input class="form-control form-control-sm" id="chatInput" placeholder="Escreva a sua questão..." autocomplete="off"><button class="btn btn-primary btn-sm"><i class="bi bi-send"></i></button></form></section></div></main><script>const messages=document.getElementById("messages");const input=document.getElementById("chatInput");function ask(text){input.value=text;document.getElementById("chatForm").requestSubmit()}document.getElementById("chatForm").addEventListener("submit",e=>{e.preventDefault();const text=input.value.trim();if(!text)return;messages.insertAdjacentHTML("beforeend",`<div class="message user">${text}</div><div class="message bot">Posso encaminhar essa questão para o serviço municipal adequado. Consulte também <a href="servicos.html">os serviços disponíveis</a> ou <a href="agendamento.html">marque um atendimento</a>.</div>`);input.value="";messages.scrollTop=messages.scrollHeight})</script></body></html>
