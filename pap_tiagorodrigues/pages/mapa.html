<!doctype html>
<html lang="pt-PT">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mapa municipal | Vila Nova Digital</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="../assets/css/styles.css"><style>.map-page{background:var(--soft);min-height:100vh}.map-head{padding:35px 0 20px}.map-layout{display:grid;grid-template-columns:310px 1fr;gap:16px;height:650px}.map-filters,.map-shell{background:#fff;border:1px solid var(--line);border-radius:13px}.map-filters{padding:22px}.map-filters h2{font-size:1.1rem}.map-filters label{display:block;font-size:.72rem;font-weight:800;margin:20px 0 7px}.map-legend{display:grid;gap:12px;margin-top:25px;padding-top:20px;border-top:1px solid var(--line);font-size:.72rem}.map-legend span{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}.map-shell{overflow:hidden}.full-map{width:100%;height:100%}.map-list{margin-top:15px;display:grid;gap:8px}.map-list button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;text-align:left;font-size:.7rem}.map-list button:hover{border-color:var(--blue);color:var(--blue)}@media(max-width:800px){.map-layout{grid-template-columns:1fr;height:auto}.map-filters{order:2}.map-shell{height:480px}}</style></head>
<body class="map-page"><header class="main-nav"><div class="container-fluid shell d-flex justify-content-between align-items-center py-3"><a class="brand" href="../index.html"><span class="brand-symbol"><i class="bi bi-buildings"></i></span><span><b>VILA NOVA</b><small>DIGITAL</small></span></a><a href="../index.html" class="btn btn-outline-primary btn-sm">Voltar ao portal</a></div></header><main class="container-fluid shell map-head"><span class="overline">Dados no território</span><h1 class="mt-2">Mapa municipal</h1><p class="text-muted">Explore ocorrências, equipamentos e serviços de Vila Nova.</p><div class="map-layout"><aside class="map-filters"><h2>Filtrar informação</h2><label for="mapType">Mostrar no mapa</label><select id="mapType" class="form-select form-select-sm"><option value="all">Todos os elementos</option><option value="occurrence">Ocorrências urbanas</option><option value="equipment">Equipamentos públicos</option></select><label>Ocorrências por estado</label><div class="map-legend"><div><span style="background:#e56e63"></span>Em análise (12)</div><div><span style="background:#e99835"></span>Em execução (24)</div><div><span style="background:#16a28a"></span>Resolvidas (86)</div></div><label>Locais em destaque</label><div class="map-list"><button data-location="41.1496,-8.6109"><i class="bi bi-building me-2"></i>Paços do Município</button><button data-location="41.153,-8.62"><i class="bi bi-tree me-2"></i>Parque Central</button><button data-location="41.145,-8.6"><i class="bi bi-mortarboard me-2"></i>Escola Secundária</button></div></aside><div class="map-shell"><div id="fullMap" class="full-map" aria-label="Mapa municipal de Vila Nova"></div></div></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map("fullMap").setView([41.1496,-8.6109],13);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"&copy; OpenStreetMap contributors"}).addTo(map);const points=[{position:[41.1496,-8.6109],title:"Paços do Município",text:"Atendimento municipal",type:"equipment"},{position:[41.153,-8.62],title:"Parque Central",text:"Espaço verde municipal",type:"equipment"},{position:[41.145,-8.6],title:"Buraco na via",text:"Avenida da República · Em execução",type:"occurrence"},{position:[41.157,-8.601],title:"Iluminação pública",text:"Rua Central · Resolvida",type:"occurrence"}];const markers=points.map((point)=>{const marker=L.marker(point.position).addTo(map).bindPopup(`<strong>${point.title}</strong><br><small>${point.text}</small>`);marker.pointType=point.type;return marker});document.getElementById("mapType").addEventListener("change",(event)=>markers.forEach((marker)=>marker.setOpacity(event.target.value==="all"||event.target.value===marker.pointType?1:0)));document.querySelectorAll("[data-location]").forEach((button)=>button.addEventListener("click",()=>map.setView(button.dataset.location.split(",").map(Number),16)));</script></body></html>
